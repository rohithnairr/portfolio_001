  <text x="128" y="122" font-family="monospace" font-size="12" fill="#555">$</text>
  <text x="142" y="122" font-family="monospace" font-size="12" fill="#9ecb42">claude</text>
  <text x="196" y="122" font-family="monospace" font-size="12" fill="#aaa"> "create a design system button component"</text>
  <text x="128" y="148" font-family="monospace" font-size="12" fill="#444">◆  Analysing design tokens...</text>
  <text x="128" y="170" font-family="monospace" font-size="12" fill="#444">◆  Reading globals.css</text>
  <text x="128" y="192" font-family="monospace" font-size="12" fill="#444">◆  Generating variants...</text>
  <!-- Generated code block -->
  <rect x="120" y="208" width="488" height="180" rx="4" fill="#0a0a0a" stroke="#222" stroke-width="1"/>
  <text x="136" y="228" font-family="monospace" font-size="11" fill="#569cd6">export</text>
  <text x="187" y="228" font-family="monospace" font-size="11" fill="#fff"> </text>
  <text x="191" y="228" font-family="monospace" font-size="11" fill="#569cd6">function</text>
  <text x="253" y="228" font-family="monospace" font-size="11" fill="#dcdcaa"> Button</text>
  <text x="302" y="228" font-family="monospace" font-size="11" fill="#fff">({ variant, children }) {</text>
  <text x="152" y="248" font-family="monospace" font-size="11" fill="#569cd6">  const</text>
  <text x="196" y="248" font-family="monospace" font-size="11" fill="#9cdcfe"> base </text>
  <text x="228" y="248" font-family="monospace" font-size="11" fill="#fff">= </text>
  <text x="244" y="248" font-family="monospace" font-size="11" fill="#ce9178">"inline-flex items-center px-4 py-2"</text>
  <text x="152" y="268" font-family="monospace" font-size="11" fill="#569cd6">  const</text>
  <text x="196" y="268" font-family="monospace" font-size="11" fill="#9cdcfe"> styles</text>
  <text x="235" y="268" font-family="monospace" font-size="11" fill="#fff">= { </text>
  <text x="254" y="268" font-family="monospace" font-size="11" fill="#9cdcfe">primary</text>
  <text x="305" y="268" font-family="monospace" font-size="11" fill="#fff">: </text>
  <text x="315" y="268" font-family="monospace" font-size="11" fill="#ce9178">"bg-ink text-white"</text>
  <text x="152" y="288" font-family="monospace" font-size="11" fill="#fff">              </text>
  <text x="254" y="288" font-family="monospace" font-size="11" fill="#9cdcfe">ghost</text>
  <text x="292" y="288" font-family="monospace" font-size="11" fill="#fff">: </text>
  <text x="302" y="288" font-family="monospace" font-size="11" fill="#ce9178">"border border-line bg-white"</text>
  <text x="152" y="308" font-family="monospace" font-size="11" fill="#fff">  }</text>
  <text x="152" y="328" font-family="monospace" font-size="11" fill="#c586c0">  return</text>
  <text x="200" y="328" font-family="monospace" font-size="11" fill="#fff"> &lt;</text>
  <text x="214" y="328" font-family="monospace" font-size="11" fill="#4ec9b0">button</text>
  <text x="256" y="328" font-family="monospace" font-size="11" fill="#9cdcfe"> className</text>
  <text x="326" y="328" font-family="monospace" font-size="11" fill="#fff">={`${base} ${styles[variant]}`}&gt;{children}&lt;/</text>
  <text x="560" y="328" font-family="monospace" font-size="11" fill="#4ec9b0">button</text>
  <text x="602" y="328" font-family="monospace" font-size="11" fill="#fff">&gt;</text>
  <text x="136" y="348" font-family="monospace" font-size="11" fill="#fff">}</text>
  <!-- Cursor blink -->
  <rect x="128" y="394" width="8" height="14" fill="#9ecb42" opacity="0.9"/>
  <!-- Right panel — component preview -->
  <rect x="660" y="60" width="320" height="360" rx="8" fill="#111111" stroke="#2a2a2a" stroke-width="1"/>
  <rect x="660" y="60" width="320" height="36" rx="8" fill="#1a1a1a"/>
  <rect x="660" y="84" width="320" height="12" fill="#1a1a1a"/>
  <text x="820" y="82" font-family="monospace" font-size="11" fill="#555" text-anchor="middle">Preview</text>
  <!-- Button previews -->
  <text x="680" y="130" font-family="monospace" font-size="10" fill="#444">variant="primary"</text>
  <rect x="680" y="140" width="120" height="36" rx="0" fill="#111111" stroke="#2a2a2a" stroke-width="1"/>
  <text x="740" y="163" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">Explore Works</text>
  <text x="680" y="200" font-family="monospace" font-size="10" fill="#444">variant="ghost"</text>
  <rect x="680" y="210" width="120" height="36" rx="0" fill="transparent" stroke="#333" stroke-width="1"/>
  <text x="740" y="233" font-family="sans-serif" font-size="13" fill="#aaa" text-anchor="middle">Contact Me</text>
  <!-- Token reference -->
  <rect x="680" y="270" width="280" height="110" rx="4" fill="#0a0a0a" stroke="#222" stroke-width="1"/>
  <text x="696" y="292" font-family="monospace" font-size="10" fill="#9ecb42">/* Design Tokens */</text>
  <text x="696" y="312" font-family="monospace" font-size="10" fill="#569cd6">--ink:</text>
  <text x="738" y="312" font-family="monospace" font-size="10" fill="#ce9178"> #111111</text>
  <text x="696" y="328" font-family="monospace" font-size="10" fill="#569cd6">--surface:</text>
  <text x="757" y="328" font-family="monospace" font-size="10" fill="#ce9178"> #ffffff</text>
  <text x="696" y="344" font-family="monospace" font-size="10" fill="#569cd6">--accent:</text>
  <text x="750" y="344" font-family="monospace" font-size="10" fill="#ce9178"> #9ecb42</text>
  <text x="696" y="360" font-family="monospace" font-size="10" fill="#569cd6">--line:</text>
  <text x="737" y="360" font-family="monospace" font-size="10" fill="#ce9178"> #e4e1d8</text>
  <!-- Glow -->
  <ellipse cx="360" cy="400" rx="200" ry="40" fill="#9ecb42" opacity="0.04"/>
</svg>
