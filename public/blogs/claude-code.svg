  <rect x="100" y="60" width="520" height="36" rx="8" fill="#1a1a1a"/>
  <rect x="100" y="84" width="520" height="12" fill="#1a1a1a"/>
  <circle cx="128" cy="78" r="6" fill="#FF5F57"/>
  <circle cx="148" cy="78" r="6" fill="#FEBC2E"/>
  <circle cx="168" cy="78" r="6" fill="#28C840"/>
  <text x="300" y="82" font-family="monospace" font-size="11" fill="#555" text-anchor="middle">claude-code — bash — 120×40</text>
