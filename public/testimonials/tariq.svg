  <path d="M23 40 C23 28 30 22 40 22 C50 22 57 28 57 40 C57 35 53 24 40 24 C27 24 23 35 23 40Z" fill="#1A0800"/>
  <!-- Ears -->
  <ellipse cx="23.5" cy="44" rx="2.5" ry="3.5" fill="#6B3A2A"/>
  <ellipse cx="56.5" cy="44" rx="2.5" ry="3.5" fill="#6B3A2A"/>
