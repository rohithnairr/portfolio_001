  <path d="M37 45 Q38 48 39 46 Q40 48 41 46 Q42 48 43 45" stroke="#50281A" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- Mouth -->
  <path d="M34 52 Q40 57 46 52" stroke="#50281A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Beard / stubble shadow -->
